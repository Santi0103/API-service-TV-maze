<div class="app-shell">

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-d">D</span>oh!
      </div>
      <div class="header-center">
        <h1 class="site-title">Los Simpsons</h1>
        <p class="site-subtitle">Información oficial vía TVMaze API</p>
      </div>
      <div class="header-badge">
        <span class="badge-dot"></span>
        API Live
      </div>
    </div>
  </header>

  <main class="site-main">

    <!-- Tabs de navegación -->
    <div class="tabs-bar">
      <button class="tab-btn" [class.active]="activeTab === 'info'" (click)="setTab('info')">
        <span>📋</span> Información
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'episodes'" (click)="setTab('episodes')">
        <span>🎬</span> Episodios
      </button>
    </div>

    <!-- Tab: Información general -->
    <div *ngIf="activeTab === 'info'">
      <div class="controls-bar">
        <button class="toggle-btn" (click)="toggleSim()">
          <span class="btn-icon">{{ showSim ? '👁' : '👁‍🗨' }}</span>
          {{ showSim ? 'Ocultar información' : 'Mostrar información' }}
        </button>
      </div>

      <app-characters-list
        *ngIf="showSim"
        [characterList]="sim">
      </app-characters-list>

      <div class="loading-state" *ngIf="sim.length === 0 && showSim">
        <div class="spinner"></div>
        <p>Cargando datos de la serie…</p>
      </div>
    </div>

    <!-- Tab: Episodios -->
    <div *ngIf="activeTab === 'episodes'">
      <div class="loading-state" *ngIf="loadingEpisodes">
        <div class="spinner"></div>
        <p>Cargando episodios…</p>
      </div>

      <app-episodes-list
        *ngIf="!loadingEpisodes"
        [episodes]="episodes">
      </app-episodes-list>
    </div>

  </main>

  <footer class="site-footer">
    <p>Datos proporcionados por <a href="https://www.tvmaze.com" target="_blank">TVMaze API</a> · Hecho con Angular</p>
  </footer>

</div>
